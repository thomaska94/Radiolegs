<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Radiolegs Audience Light</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
}

#light {
  position: fixed;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #000;

  transition:
    background-color 0.25s ease;

  font-family: Arial, sans-serif;
}

/* RADIOLEGS LOGO */

#logo {
  width: 72%;
  max-width: 500px;

  height: auto;

  filter:
    drop-shadow(0 4px 15px rgba(0,0,0,0.35));

  pointer-events: none;
  user-select: none;
}

/* START BUTTON */

#start {
  position: absolute;
  z-index: 10;

  border: none;

  padding: 20px 38px;

  border-radius: 50px;

  background: white;
  color: black;

  font-size: 18px;
  font-weight: bold;
}

/* SMALL MESSAGE */

#message {
  position: absolute;

  bottom: 25px;

  width: 100%;

  text-align: center;

  color: rgba(255,255,255,0.7);

  font-size: 12px;
}

/* LIGHT PULSE */

.active {
  animation: pulse 0.75s infinite alternate;
}

@keyframes pulse {

  from {
    filter: brightness(0.55);
  }

  to {
    filter: brightness(1.15);
  }

}

@media (prefers-reduced-motion: reduce) {

  .active {
    animation: none;
  }

}

</style>

</head>

<body>

<div id="light">

  <!-- RADIOLEGS LOGO -->
  <img
    id="logo"
    src="radiolegs-logo.png"
    alt="Radiolegs"
  >

  <button id="start">
    TAP TO JOIN ✨
  </button>

  <div id="message">
    Turn your screen brightness up
  </div>

</div>

<script>

const light =
  document.getElementById("light");

const start =
  document.getElementById("start");

const message =
  document.getElementById("message");


const colours = [

  "#ff003c",
  "#00ff66",
  "#0066ff",
  "#a600ff",
  "#ffff00",
  "#00eaff",
  "#ff6600",
  "#ff00aa"

];


let timer = null;


function randomColour() {

  const index =
    Math.floor(
      Math.random() *
      colours.length
    );

  return colours[index];

}


function changeColour() {

  light.style.backgroundColor =
    randomColour();

}


function startLight() {

  start.style.display = "none";

  message.style.display = "none";

  light.classList.add("active");

  changeColour();


  timer = setInterval(

    function() {

      changeColour();

    },

    700

  );


  /* Fullscreen */

  if (
    document.documentElement
      .requestFullscreen
  ) {

    document.documentElement
      .requestFullscreen()
      .catch(function() {});

  }


  /* Keep screen awake */

  if ("wakeLock" in navigator) {

    navigator.wakeLock
      .request("screen")
      .catch(function() {});

  }

}


start.addEventListener(
  "click",
  startLight
);

</script>

</body>
</html>
